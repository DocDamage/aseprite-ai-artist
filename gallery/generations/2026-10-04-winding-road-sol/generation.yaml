benchmark:
  prompt: winding-road
  revision: 1
  results:
    - criterion: land-validate
      pass: true
      note: Passed, score 90; two outline warnings on river and road.
    - criterion: land-palette
      pass: true
      note: Palette is the 16 PICO-8 entries.
    - criterion: land-read
      pass: false
      note: The road cannot be traced to the castle gate; it turns off right at mid-height and only reappears as dashes below the castle.
    - criterion: land-spec
      pass: true
      note: Nine layers as specified, sun low right, river from the left, windmill with 4 blades.
    - criterion: land-road
      pass: false
      note: No hidden stretch behind a hill and no visible switchbacks up to a 1 px end at the gate.
    - criterion: land-depth
      pass: false
      note: Few posts and no shrinking rhythm; the mid-ground hills are flat saturated greens with no depth falloff.
    - criterion: loop-frames
      pass: true
      note: 24 frames × 100 ms, forward tag loop 1–24.
    - criterion: loop-seamless
      pass: true
      note: "Judged on the GIF: no visible hitch at the wrap."
    - criterion: loop-static
      pass: true
      note: "Judged on frames 1–24: scenery layers look unchanged."
    - criterion: loop-windmill
      pass: false
      note: Blade length and thickness change between angles.
    - criterion: loop-river
      pass: false
      note: Only sparse white dashes; downstream travel does not read.
    - criterion: loop-smoke
      pass: false
      note: The smoke is a few barely visible pixels; no rising, growing puffs.
    - criterion: loop-wagon
      pass: false
      note: The wagon is a white box that jumps along the road and is not seen crossing the bridge.
    - criterion: loop-validate
      pass: true
      note: Final validate clean per the run; palette still 16 entries.
